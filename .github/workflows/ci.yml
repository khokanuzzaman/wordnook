name: CI

on:
  pull_request:
  push:
    branches:
      - feat/analytics-and-tier1-fixes
      - main

# A newer push to the same branch/PR cancels the run still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version used locally so CI and dev machines agree.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Analyze + test only: no signing keys, AdMob IDs or builds are needed.
      # Same checks as `flutter analyze` (infos are fatal), but every issue is
      # also emitted as a GitHub annotation so it shows inline on the PR diff.
      - name: Analyze
        run: |
          if ! dart analyze --fatal-infos --format=machine > analyze.txt 2>&1; then
            sed -n 's#^\([A-Z]*\)|[A-Z_]*|\([A-Z_]*\)|'"$GITHUB_WORKSPACE"'/\([^|]*\)|\([0-9]*\)|\([0-9]*\)|[0-9]*|\(.*\)$#::error file=\3,line=\4,col=\5::\1 \2: \6#p' analyze.txt
            cat analyze.txt
            exit 1
          fi
          echo "No issues found."

      # Each failing test is also emitted as an annotation (file, line, error).
      - name: Test
        run: |
          set +e
          flutter test --reporter github --file-reporter json:test-report.json
          status=$?
          if [ $status -ne 0 ]; then
            jq -rs '
              (map(select(.type == "testStart"))
                | map({key: (.test.id | tostring), value: .test})
                | from_entries) as $tests
              | (map(select(.type == "print"))) as $prints
              | map(select(.type == "error"))
              | group_by(.testID)[]
              | .[0].testID as $id
              | $tests[($id | tostring)] as $t
              | (($prints | map(select(.testID == $id) | .message))
                  + map(.error) | join("%0A----%0A")) as $msg
              | "::error file=\(($t.root_url // $t.url // "")
                    | sub("^file://" + env.GITHUB_WORKSPACE + "/"; "")),line=\($t.root_line // $t.line // 1),title=\($t.name | gsub("[,:]"; " "))::\($msg | .[0:6000] | gsub("\n"; "%0A"))"
            ' test-report.json
          fi
          exit $status

  # Builds the release APK so R8 (minify + resource shrinking) runs on every
  # change: a missing keep rule fails here, not on a player's phone. No secrets:
  # without key.properties / admob.properties Gradle signs with the debug key
  # and uses Google's TEST AdMob ids. Nothing is uploaded.
  build-android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK (R8)
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || {
            grep -E "Missing class|ERROR:|R8:|e: " build.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
          ls -l build/app/outputs/flutter-apk/app-release.apk

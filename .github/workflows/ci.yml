name: CI

on:
  pull_request:
  push:
    branches:
      - feat/analytics-and-tier1-fixes
      - main

# A newer push to the same branch/PR cancels the run still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version used locally so CI and dev machines agree.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Analyze + test only: no signing keys, AdMob IDs or builds are needed.
      # Same checks as `flutter analyze` (infos are fatal), but every issue is
      # also emitted as a GitHub annotation so it shows inline on the PR diff.
      - name: Analyze
        run: |
          if ! dart analyze --fatal-infos --format=machine > analyze.txt 2>&1; then
            sed -n 's#^\([A-Z]*\)|[A-Z_]*|\([A-Z_]*\)|'"$GITHUB_WORKSPACE"'/\([^|]*\)|\([0-9]*\)|\([0-9]*\)|[0-9]*|\(.*\)$#::error file=\3,line=\4,col=\5::\1 \2: \6#p' analyze.txt
            cat analyze.txt
            exit 1
          fi
          echo "No issues found."

      # Each failing test is also emitted as an annotation (file, line, error).
      - name: Test
        run: |
          set +e
          flutter test --reporter github --file-reporter json:test-report.json
          status=$?
          if [ $status -ne 0 ]; then
            jq -rs '
              (map(select(.type == "testStart"))
                | map({key: (.test.id | tostring), value: .test})
                | from_entries) as $tests
              | map(select(.type == "error"))[]
              | . as $e
              | $tests[($e.testID | tostring)] as $t
              | "::error file=\(($t.root_url // $t.url // "")
                    | sub("^file://" + env.GITHUB_WORKSPACE + "/"; "")),line=\($t.root_line // $t.line // 1),title=\($t.name | gsub("[,:]"; " "))::\(($e.error + "%0A" + ($e.stackTrace // "")) | .[0:2000] | gsub("\n"; "%0A"))"
            ' test-report.json
          fi
          exit $status

name: daily_word_game
description: A daily word-guessing puzzle game (Android + iOS).
publish_to: "none"
version: 0.2.1+6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  google_mobile_ads: ^5.1.0
  app_tracking_transparency: ^2.0.0
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  share_plus: ^13.2.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/words/answers.txt
    - assets/words/answers_easy.txt
    - assets/words/answers_medium.txt
    - assets/words/answers_hard.txt
    - assets/words/allowed.txt
  # Bundled so fonts render fully offline with no first-launch pop-in. These are
  # variable fonts; Flutter applies the weight axis from TextStyle.fontWeight.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
